[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Sentinel5G AI engine: autoencoder-based unsupervised threat scoring for telecom signaling traffic."
requires-python = ">=3.11"
dependencies = [
    # Serving-path only (sentinel_ai.server / features -- what Dockerfile's
    # `pip install .` actually needs). torch/onnx/onnxscript are NOT here:
    # production inference loads the exported ONNX graph via onnxruntime
    # (see sentinel_ai/model.py's docstring), and pulling torch's default
    # PyPI wheel into the serving image drags in gigabytes of unused NVIDIA
    # CUDA libraries -- besides bloating the image, that's what made the
    # release pipeline's Trivy scan itself time out analyzing
    # site-packages/nvidia/cusparselt. See the "train" extra below.
    "onnxruntime>=1.18,<2.0",
    "numpy>=1.26,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "nats-py>=2.7,<3.0",
]

[project.optional-dependencies]
# Needed only by scripts/train.py, scripts/export_onnx.py,
# scripts/evaluate_model.py, and tests/test_inference.py -- never imported
# by the serving path (sentinel_ai/server.py, features.py), so kept out of
# the base `dependencies` Dockerfile installs. Install with `.[dev,train]`
# for local development/testing.
train = [
    "torch>=2.2,<3.0",
    "onnx>=1.22,<2.0",  # >=1.22 fixes several known CVEs in earlier 1.x releases (see pip-audit)
    "onnxscript>=0.1,<1.0",
]
dev = [
    "pytest>=9.0.3,<10.0",  # >=9.0.3 fixes PYSEC-2026-1845
    "black>=26.3.1,<27.0",  # >=26.3.1 fixes PYSEC-2026-2120/2121
    "flake8>=7.0,<8.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "setuptools>=83.0",  # fixes PYSEC-2026-3447 (pulled in transitively otherwise)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools>=83.0"]  # fixes PYSEC-2026-3447
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_ai*", "scripts*"]
