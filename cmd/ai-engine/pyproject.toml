[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Sentinel5G AI engine: autoencoder-based unsupervised threat scoring for telecom signaling traffic."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<3.0",
    "onnx>=1.22,<2.0",  # >=1.22 fixes several known CVEs in earlier 1.x releases (see pip-audit)
    "onnxruntime>=1.18,<2.0",
    "onnxscript>=0.1,<1.0",
    "numpy>=1.26,<3.0",  # <3.0 (not <2.0): onnx>=1.22's ml-dtypes dep requires numpy>=2.1 on Python 3.13+
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "nats-py>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "black>=24.3,<25.0",
    "flake8>=7.0,<8.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_ai*", "scripts*"]
