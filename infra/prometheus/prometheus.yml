# =============================================================================
# Prometheus — scrape configuration for EventStream Observability Engine
# =============================================================================
# Each backend service exposes /metrics in Prometheus exposition format.
# When running services on the host (not in docker), Prometheus reaches them
# via host.docker.internal (Windows / macOS).
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: eventstream-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ingestion-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: ingestion-service

  - job_name: processing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3002"]
        labels:
          service: processing-service

  - job_name: realtime-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3003"]
        labels:
          service: realtime-gateway

  - job_name: webhook-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3004"]
        labels:
          service: webhook-service

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
