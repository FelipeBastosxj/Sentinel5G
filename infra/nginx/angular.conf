server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # SPA fallback — serve index.html for any route not found as a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets with hash in filename forever
    location ~* \.[0-9a-f]+\.(js|css|woff2|woff|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
