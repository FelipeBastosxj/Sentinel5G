# =============================================================================
# Open Telecom Webhook Observability — Infrastructure
# =============================================================================
# Starts all required infrastructure services for local development.
#
# Usage:
#   docker compose up -d                             Start all infra services
#   docker compose --profile services up -d --build  Build + start app services
#   docker compose down                              Stop all services
#   docker compose down -v                           Full reset (removes volumes)
#   docker compose logs -f <service>                 Tail a service's logs
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary database for events, workspaces, tokens
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: telecom-webhook-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telecom_webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-webhook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - telecom-webhook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook_user} -d ${POSTGRES_DB:-telecom_webhooks}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — rate limiting, query cache, session store (optional)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: telecom-webhook-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - telecom-webhook-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Services (profile: services) ───────────────────────────────────

  # ---------------------------------------------------------------------------
  # Webhook Receiver — accepts inbound webhooks from telecom providers
  # ---------------------------------------------------------------------------
  ingestion-service:
    profiles: [services]
    build:
      context: ..
      dockerfile: services/ingestion-service/Dockerfile
    container_name: telecom-webhook-ingestion
    restart: unless-stopped
    ports:
      - "${INGESTION_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      INGESTION_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-webhook_user}:${POSTGRES_PASSWORD:-webhook_pass}@postgres:5432/${POSTGRES_DB:-telecom_webhooks}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PROCESSING_BASE_URL: http://processing-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      processing-service:
        condition: service_healthy
    networks: [telecom-webhook-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Processing Service — normalises, enriches, and stores events
  # ---------------------------------------------------------------------------
  processing-service:
    profiles: [services]
    build:
      context: ..
      dockerfile: services/processing-service/Dockerfile
    container_name: telecom-webhook-processing
    restart: unless-stopped
    ports:
      - "${PROCESSING_PORT:-3003}:3003"
    environment:
      NODE_ENV: production
      PROCESSING_PORT: "3003"
      DATABASE_URL: postgresql://${POSTGRES_USER:-webhook_user}:${POSTGRES_PASSWORD:-webhook_pass}@postgres:5432/${POSTGRES_DB:-telecom_webhooks}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [telecom-webhook-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Realtime Gateway — WebSocket / SSE server for live event push
  # ---------------------------------------------------------------------------
  realtime-gateway:
    profiles: [services]
    build:
      context: ..
      dockerfile: services/realtime-gateway/Dockerfile
    container_name: telecom-webhook-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3004}:3004"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER:-webhook_user}:${POSTGRES_PASSWORD:-webhook_pass}@postgres:5432/${POSTGRES_DB:-telecom_webhooks}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REALTIME_GATEWAY_CORS_ORIGIN: "http://localhost:4200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [telecom-webhook-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Angular Dashboard — built with ng build, served via nginx on port 4200
  # ---------------------------------------------------------------------------
  frontend:
    profiles: [services]
    build:
      context: ..
      dockerfile: frontend/angular-dashboard/Dockerfile
    container_name: telecom-webhook-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      processing-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
    networks: [telecom-webhook-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  telecom-webhook-network:
    driver: bridge
    name: telecom-webhook-network
