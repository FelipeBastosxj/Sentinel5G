image:
  repository: ghcr.io/felipebastosxj/sentinel5g-operator
  # Must match an actual published tag (release.yml tags images with the
  # full ref name, "v0.2.2", not "0.2.2") -- ghcr.io/.../sentinel5g-operator:0.2.2
  # doesn't exist and would ImagePullBackOff.
  tag: "v0.2.2"
  pullPolicy: IfNotPresent

replicaCount: 1

# Run the operator as a DaemonSet instead of a Deployment, for real
# multi-node eBPF coverage: guarantees exactly one Pod per matching node
# (see nodeSelector/tolerations below to scope which ones), rather than
# however many *distinct* nodes replicaCount Pods happen to land on with
# the podAntiAffinity workaround docs/integrations.md otherwise describes.
# replicaCount is ignored when this is true (DaemonSets don't have one).
#
# Implies hostNetwork: true and dnsPolicy: ClusterFirstWithHostNet (see
# templates/deployment.yaml) -- REQUIRED for ebpf.interface to actually
# attach to the node's real network interface instead of this Pod's own
# veth, which would only ever see this Pod's own traffic, never the
# telecom workloads it's meant to protect. hostNetwork is a real security
# trade-off (the Pod shares the host's network namespace instead of
# getting its own -- it can see and bind any port on the host), which is
# exactly why this isn't folded into ebpf.enabled itself and needs its own
# explicit opt-in.
daemonset:
  enabled: false

serviceAccount:
  create: true
  name: sentinel5g-operator

# eBPF enforcement -- both actions.ebpfBlock (per source IP) and
# actions.ebpfBlockTunnel (per GTP-U tunnel) -- needs the manager container
# to attach an XDP program on the target interface, which requires elevated
# capabilities the chart does NOT grant by default (see securityContext
# below and docs/integrations.md). Leave false to run in mesh-isolation-only
# / detection-only mode; both actions are silent no-ops while it is.
ebpf:
  enabled: false
  interface: eth0
  objectPath: /var/run/sentinel5g/packet_filter.o
  # Linux capabilities added to securityContext when ebpf.enabled is true
  # (see templates/deployment.yaml) -- CAP_BPF+CAP_NET_ADMIN cover attaching
  # the XDP program on any kernel new enough to have CAP_BPF (5.8+);
  # override to ["SYS_ADMIN", "NET_ADMIN"] on older kernels, per
  # docs/integrations.md. Previously this had to be added by hand on top of
  # ebpf.enabled: true -- easy to flip the feature "on" and still get a
  # silent no-op from a missing capability.
  capabilities: ["BPF", "NET_ADMIN"]
  # bpffs directory the ENFORCEMENT maps (blocklist, blocklist_v6,
  # tunnel_blocklist, tunnel_blocklist_v6) are pinned into, so an active
  # drop outlives the operator process. Without it, a `helm upgrade`, an
  # OOM kill or a crash detaches the XDP program and takes every mitigation
  # with it, while each policy's status goes on asserting blocks that are no
  # longer in force -- the control reporting itself as on while being off
  # (ROADMAP.md Phase 4). Its PARENT directory is mounted from the node as a
  # hostPath (see templates/deployment.yaml), which is why this is a path
  # and not a boolean.
  #
  # Set to "" to disable pinning and the hostPath mount. The periodic
  # kernel-vs-status reconciliation below still repairs the maps after a
  # restart; pinning is what makes the drops correct DURING the gap rather
  # than from the next sync onwards.
  pinPath: /sys/fs/bpf/sentinel5g

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  logLevel: info
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  threatScoreThreshold: 0.85
  meshAdapter: istio
  # How long after startup before every TelecomSecurityPolicy reports
  # ScoringPipelineReady=False (visible as the `Scoring` column in
  # `kubectl get tsp`). The AI engine is NOT part of this chart -- it's
  # deployed separately and needs a trained model -- and without it nothing
  # ever publishes a ThreatScoreEvent, leaving every policy at
  # Phase: Monitoring indefinitely with no other signal that half the system
  # is missing. Raise this if your AI engine legitimately takes longer than
  # 10m to start scoring; it does not affect detection, only when the
  # operator starts saying it hasn't seen a score.
  scoringPipelineGrace: 10m

  # Reactor rate limit. Bounds how fast the operator issues NON-meaningful
  # status refreshes per policy -- the ObservedThreatScore-only writes a
  # score storm produces (one ML score per packet, at-least-once delivery).
  # Meaningful writes (phase transitions, blocklist changes) are NEVER
  # throttled, so no decision is ever lost; this only protects the API server
  # from refresh pressure. statusWritesPerSecond: 0 disables it. Visible as
  # sentinel5g_reactor_status_writes_throttled_total.
  reactor:
    statusWritesPerSecond: 10
    statusWriteBurst: 20

  # Global mitigation kill switch. When enabled, the operator polls a
  # ConfigMap (killSwitch.configMapName, in the release namespace) and, while
  # that ConfigMap has data engaged=true, withholds EVERY mitigation across
  # EVERY policy -- detection continues (scores, crossings, Alerting phase),
  # nothing is blocked or quarantined. It is the one lever for an operator
  # watching a mitigation go wrong across many policies at once, and it takes
  # effect within killSwitch.pollInterval with no operator restart:
  #   kubectl -n <release-ns> create configmap sentinel5g-killswitch   #     --from-literal=engaged=true     # stop now
  #   kubectl -n <release-ns> delete configmap sentinel5g-killswitch   # resume
  # A tight get-by-name Role (templates/killswitch-rbac.yaml) is created for
  # it; set enabled=false to add neither the poll nor the RBAC.
  killSwitch:
    enabled: true
    configMapName: sentinel5g-killswitch
    pollInterval: 2s

  # How often the operator compares the eBPF enforcement maps against what
  # the TelecomSecurityPolicy status subresources say should be enforced,
  # re-applying the difference and exporting it as
  # sentinel5g_blocklist_drift_total. A sync always runs once at startup
  # regardless of this value -- that is the restart replay -- so this only
  # sets the periodic cadence. Set to a negative duration (e.g. -1s) to keep
  # only the startup sync.
  blocklistReconcileInterval: 1m

  # Deterministic (non-ML) GTP-U tunnel-flood detector (pkg/detect). Closes
  # ROADMAP.md Phase 2.5's in-tunnel-flood gap, which the autoencoder
  # provably cannot: a real in-tunnel flood reconstructs BETTER than normal
  # traffic (0.0679 vs a 0.0811 baseline), so no threshold on the model's
  # score can separate them. Publishes a ThreatScoreEvent with score 1.0 and
  # model "rule:gtpu-tunnel-flood", which then goes through exactly the same
  # policy/sensitivity/autoMitigate gating as an ML score -- a detection-only
  # pilot stays detection-only.
  gtpuTunnelFlood:
    enabled: true
    # Packets/second on a SINGLE tunnel (one TEID), not per source IP. NOT
    # empirically validated against a production N3 interface -- see
    # docs/paper-data/02-ai-training-inference.md and .env.example.
    packetsPerSecond: 1000
    # Minimum interval between events for one (source IP, TEID).
    cooldown: 30s
    # What to DO about a flagged tunnel is a per-policy CRD decision, not a
    # chart value: set actions.ebpfBlockTunnel: true on the
    # TelecomSecurityPolicy to drop that one tunnel instead of the whole
    # source IP. Needs ebpf.enabled above, like any other drop.

  # Deterministic GTP-U source-flood detector (pkg/detect), the per-PEER
  # counterpart to gtpuTunnelFlood above. It exists because a per-tunnel
  # threshold is structurally blind to a flood spread thinly across many
  # TEIDs -- 200 tunnels at 999 pkt/s each is ~200,000 pkt/s from one peer
  # and crosses the per-tunnel threshold zero times (ROADMAP.md Phase 4).
  # Neither threshold can be set to do the other's job, which is why there
  # are two. Publishes model "rule:gtpu-source-flood" with NO TEID, so the
  # fitting action is actions.ebpfBlock (source-wide) -- a policy set only
  # for ebpfBlockTunnel counts a no_teid no-op, because there is no single
  # tunnel whose removal fixes an aggregate flood.
  gtpuSourceFlood:
    enabled: true
    # AGGREGATE packets/second from one source across every tunnel. NOT
    # validated against a production N3, and more consequential than the
    # per-tunnel number because the matching action drops every subscriber
    # behind the peer -- pilot in detection-only mode first (see
    # docs/production-install.md). Set to 0 to use cardinality alone.
    packetsPerSecond: 20000
    # Distinct TEIDs one source may use within the window before being
    # reported regardless of rate -- the shape of TEID rotation/spoofing,
    # which a real gNB (bearers turning over slowly) does not produce. Set
    # to 0 to use the rate alone. Both 0 is refused at startup.
    distinctTunnels: 256
    # Measurement window for both thresholds; 1s matches the kernel's own
    # rate window so the numbers are in the same units.
    window: 1s
    # Minimum interval between events for one source.
    cooldown: 30s

nats:
  # Set to the URL of an existing NATS JetStream deployment. This chart does
  # not bundle a NATS subchart; bring your own (e.g. the official `nats`
  # Helm chart) so its persistence/HA settings stay outside this chart's
  # concern (see deployments/docker-compose.yml for local dev instead).
  url: nats://sentinel5g-nats:4222
  eventsSubject: sentinel5g.events.normalized
  threatsSubject: sentinel5g.threats.scored
  streamName: SENTINEL5G

  # Auth/TLS for the NATS bus, all optional — empty reproduces the historical
  # unauthenticated connection. See docs/integrations.md: anything that can
  # reach an unauthenticated NATS_URL can forge a ThreatScoreEvent and
  # trigger a real mitigation, so set at least one of these outside of local
  # dev. credentialsFile/tlsCAFile/tlsCertFile/tlsKeyFile are in-container
  # paths — this chart doesn't template a volume mount for the underlying
  # secret, so mount it yourself (e.g. via a values override) and point
  # these at where it lands.
  credentialsFile: ""
  username: ""
  # Name of an existing Secret with a "password" key, wired to NATS_PASSWORD
  # via secretKeyRef rather than a plaintext ConfigMap value.
  existingPasswordSecret: ""
  tlsCAFile: ""
  tlsCertFile: ""
  tlsKeyFile: ""

  # The operator refuses to start against a NATS bus with none of the
  # fields above set, unless this is explicitly true. Anything that can
  # reach an unauthenticated NATS_URL can forge a ThreatScoreEvent and
  # trigger a real mitigation -- set to true only for a demo/local cluster
  # you control end to end (see scripts/quickstart.sh), never for a
  # production install (see docs/production-install.md).
  allowUnauthenticated: false

crds:
  install: true
  # Annotate the CRD with helm.sh/resource-policy: keep, so `helm uninstall`
  # leaves the CRD -- and therefore every TelecomSecurityPolicy CR -- in
  # place instead of deleting them along with the release. Defaults to true
  # because losing every policy on an accidental/routine uninstall is the
  # more dangerous default; set to false to restore Helm's normal
  # CRD-follows-release-lifecycle behavior (see docs/getting-started.md).
  # When true, a real "delete everything including the CRD" needs an
  # explicit follow-up: kubectl delete crd telecomsecuritypolicies.security.sentinel5g.io
  keep: true

# Optional NetworkPolicy restricting who can reach the NATS bus this chart
# is configured to talk to (nats.url above). NATS itself isn't deployed by
# this chart (see nats.url's comment), so this targets it by label selector
# rather than by owning it -- off by default, since a wrong/empty selector
# is dangerous (an empty podSelector matches EVERY Pod in the target
# namespace; rendering refuses with a `fail` message if enabled without one
# rather than risk silently locking down unrelated workloads). See
# docs/integrations.md's "Securing the NATS message bus" section for why
# this matters even with NATS auth configured: defense in depth against
# anything on the pod network reaching an unauthenticated or
# credential-leaked NATS_URL and forging a ThreatScoreEvent.
networkPolicy:
  nats:
    enabled: false
    # Label selector matching the NATS server Pods to protect -- e.g.
    # {app.kubernetes.io/name: nats} for the official NATS Helm chart, or
    # {app: sentinel5g-nats} for deployments/quickstart/nats.yaml. Required
    # when enabled: true.
    podSelector: {}
    # Namespace NATS runs in. Defaults to this release's namespace (NATS
    # colocated with the operator, the common case per nats.url's default
    # "nats://sentinel5g-nats:4222").
    namespace: ""
    # NATS client port to allow -- must match the port nats.url actually
    # connects to.
    port: 4222
    # Additional NetworkPolicyPeer entries (e.g. the AI engine, deployed
    # separately by charts/sentinel5g-ai-engine) allowed to reach NATS
    # alongside this chart's own operator Pods. Each entry is a full peer
    # (podSelector and/or namespaceSelector), for example:
    #   additionalClients:
    #     - podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: sentinel5g-ai-engine
    additionalClients: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Optional PodDisruptionBudget for the operator Deployment, so a node
# drain/cluster upgrade doesn't evict every replica at once. maxUnavailable
# (not minAvailable) is the safer default at replicaCount: 1 above --
# minAvailable: 1 on a single-replica Deployment would block voluntary
# eviction entirely (the drain hangs waiting for a replacement Pod that
# will never come up while the only replica is required to stay), whereas
# maxUnavailable: 1 permits exactly that at replicaCount: 1 while still
# bounding disruption once scaled up. Set minAvailable instead if you'd
# rather express the budget that way -- the two are mutually exclusive per
# the PodDisruptionBudget API; when minAvailable is set, maxUnavailable is
# ignored by this chart's template.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: null

# ServiceMonitor for Prometheus Operator (https://prometheus-operator.dev/)
# to auto-discover the operator's /metrics endpoint (exposed via the
# always-on Service this chart renders regardless of this setting) --
# requires the monitoring.coreos.com/v1 ServiceMonitor CRD to already exist
# on the cluster; if it doesn't, the template guards on
# Capabilities.APIVersions.Has and simply renders nothing (with a warning in
# the post-install NOTES) instead of failing the apply. Off by default since
# not every cluster runs Prometheus Operator -- a plain Prometheus using
# scrape_configs, or a different tool entirely, can still reach the metrics
# Service either way.
serviceMonitor:
  enabled: false
  interval: 30s
  # Extra labels merged onto the ServiceMonitor object itself -- some
  # Prometheus Operator installs only select ServiceMonitors carrying a
  # specific label (check `kubectl get prometheus -o yaml`'s
  # serviceMonitorSelector), e.g. {release: prometheus}.
  additionalLabels: {}
