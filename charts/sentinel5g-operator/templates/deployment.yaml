# Renders as a DaemonSet instead of a Deployment when daemonset.enabled is
# true -- see that value's comment for why (real multi-node eBPF coverage)
# and its hostNetwork/dnsPolicy implications below.
apiVersion: apps/v1
kind: {{ if .Values.daemonset.enabled }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.daemonset.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sentinel5g-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sentinel5g-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Rolls the pods when the ConfigMap changes. The operator reads its
        # settings once at startup (pkg/config.Load), so without this a
        # `helm upgrade` that only touches config.* or nats.* values updated
        # the ConfigMap and left the running operator on the OLD
        # configuration -- silently, with the new values visible in
        # `kubectl get cm` and not in effect. Found by changing
        # nats.threatsSubject on a live cluster and watching the operator
        # keep consuming the old subject.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sentinel5g-operator.serviceAccountName" . }}
      {{- if .Values.daemonset.enabled }}
      # Required for --bpf-interface to actually attach to the NODE's real
      # network interface instead of this Pod's own veth -- without it, the
      # XDP program would only ever see traffic to/from this Pod itself,
      # never the telecom workloads it's meant to protect. See
      # daemonset.enabled's comment in values.yaml and docs/integrations.md.
      hostNetwork: true
      # Required whenever hostNetwork is true and cluster-internal DNS names
      # (e.g. nats.url's default "sentinel5g-nats") still need to resolve --
      # otherwise the Pod uses the *node's* DNS resolver instead of the
      # cluster's, which won't know about any in-cluster Service name.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.ebpf.enabled }}
            - --bpf-object={{ .Values.ebpf.objectPath }}
            - --bpf-interface={{ .Values.ebpf.interface }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "sentinel5g-operator.fullname" . }}-config
          env:
            # Downward API, not user-tunable config: lets the manager attach
            # a Kubernetes Event (e.g. "EBPFAttachFailed") to its own Pod
            # object, so `kubectl describe pod`/`kubectl get events` surface
            # it directly instead of only the equivalent log line.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.nats.existingPasswordSecret }}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingPasswordSecret }}
                  key: password
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if and .Values.ebpf.enabled .Values.ebpf.pinPath }}
          volumeMounts:
            # The node's bpffs, so the enforcement maps can be pinned and an
            # active drop survives this Pod. Without it the operator still
            # attaches -- it falls back to an unpinned load and records an
            # EBPFPinUnavailable warning Event -- but every mitigation is
            # lost on restart until the drift reconciler re-applies it.
            - name: bpffs
              mountPath: {{ dir .Values.ebpf.pinPath | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
              {{- if .Values.ebpf.enabled }}
              add: {{ toYaml .Values.ebpf.capabilities | nindent 16 }}
              {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.ebpf.enabled .Values.ebpf.pinPath }}
      volumes:
        - name: bpffs
          hostPath:
            # Directory, not DirectoryOrCreate: if the node has no bpffs
            # mounted here, creating an empty directory on the host's root
            # filesystem would make the pin fail with a confusing EINVAL
            # instead of the Pod failing to schedule. pkg/ebpf checks the
            # filesystem type anyway and says so; this keeps the simpler
            # failure the simpler one.
            path: {{ dir .Values.ebpf.pinPath | quote }}
            type: Directory
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
