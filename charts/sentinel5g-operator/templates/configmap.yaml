apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_BIND_ADDRESS: {{ .Values.config.metricsBindAddress | quote }}
  HEALTH_PROBE_BIND_ADDRESS: {{ .Values.config.healthProbeBindAddress | quote }}
  LEADER_ELECT: {{ .Values.config.leaderElect | quote }}
  THREAT_SCORE_THRESHOLD: {{ .Values.config.threatScoreThreshold | quote }}
  MESH_ADAPTER: {{ .Values.config.meshAdapter | quote }}
  NATS_URL: {{ .Values.nats.url | quote }}
  NATS_EVENTS_SUBJECT: {{ .Values.nats.eventsSubject | quote }}
  NATS_THREATS_SUBJECT: {{ .Values.nats.threatsSubject | quote }}
  NATS_STREAM_NAME: {{ .Values.nats.streamName | quote }}
  {{- if .Values.nats.credentialsFile }}
  NATS_CREDENTIALS_FILE: {{ .Values.nats.credentialsFile | quote }}
  {{- end }}
  {{- if .Values.nats.username }}
  NATS_USERNAME: {{ .Values.nats.username | quote }}
  {{- end }}
  {{- if .Values.nats.tlsCAFile }}
  NATS_TLS_CA_FILE: {{ .Values.nats.tlsCAFile | quote }}
  {{- end }}
  {{- if .Values.nats.tlsCertFile }}
  NATS_TLS_CERT_FILE: {{ .Values.nats.tlsCertFile | quote }}
  {{- end }}
  {{- if .Values.nats.tlsKeyFile }}
  NATS_TLS_KEY_FILE: {{ .Values.nats.tlsKeyFile | quote }}
  {{- end }}
  NATS_ALLOW_UNAUTHENTICATED: {{ .Values.nats.allowUnauthenticated | quote }}
