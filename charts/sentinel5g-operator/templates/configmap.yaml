apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_BIND_ADDRESS: {{ .Values.config.metricsBindAddress | quote }}
  HEALTH_PROBE_BIND_ADDRESS: {{ .Values.config.healthProbeBindAddress | quote }}
  LEADER_ELECT: {{ .Values.config.leaderElect | quote }}
  THREAT_SCORE_THRESHOLD: {{ .Values.config.threatScoreThreshold | quote }}
  MESH_ADAPTER: {{ .Values.config.meshAdapter | quote }}
  SCORING_PIPELINE_GRACE: {{ .Values.config.scoringPipelineGrace | quote }}
  BLOCKLIST_RECONCILE_INTERVAL: {{ .Values.config.blocklistReconcileInterval | quote }}
  # Empty name disables the kill switch (pkg/config treats "" as off); the
  # namespace comes from POD_NAMESPACE via the Downward API in the Deployment.
  KILL_SWITCH_CONFIGMAP_NAME: {{ ternary .Values.config.killSwitch.configMapName "" .Values.config.killSwitch.enabled | quote }}
  KILL_SWITCH_POLL_INTERVAL: {{ .Values.config.killSwitch.pollInterval | quote }}
  # Empty when ebpf.enabled is false or ebpf.pinPath is "" -- pkg/config
  # reads an empty BPF_PIN_PATH as "do not pin", which is distinct from the
  # variable being unset (that would use the built-in default).
  BPF_PIN_PATH: {{ ternary .Values.ebpf.pinPath "" .Values.ebpf.enabled | quote }}
  GTPU_TUNNEL_FLOOD_ENABLED: {{ .Values.config.gtpuTunnelFlood.enabled | quote }}
  GTPU_TUNNEL_FLOOD_PPS: {{ .Values.config.gtpuTunnelFlood.packetsPerSecond | quote }}
  GTPU_TUNNEL_FLOOD_COOLDOWN: {{ .Values.config.gtpuTunnelFlood.cooldown | quote }}
  GTPU_SOURCE_FLOOD_ENABLED: {{ .Values.config.gtpuSourceFlood.enabled | quote }}
  GTPU_SOURCE_FLOOD_PPS: {{ .Values.config.gtpuSourceFlood.packetsPerSecond | quote }}
  GTPU_SOURCE_FLOOD_DISTINCT_TUNNELS: {{ .Values.config.gtpuSourceFlood.distinctTunnels | quote }}
  GTPU_SOURCE_FLOOD_WINDOW: {{ .Values.config.gtpuSourceFlood.window | quote }}
  GTPU_SOURCE_FLOOD_COOLDOWN: {{ .Values.config.gtpuSourceFlood.cooldown | quote }}
  NATS_URL: {{ .Values.nats.url | quote }}
  NATS_EVENTS_SUBJECT: {{ .Values.nats.eventsSubject | quote }}
  NATS_THREATS_SUBJECT: {{ .Values.nats.threatsSubject | quote }}
  NATS_STREAM_NAME: {{ .Values.nats.streamName | quote }}
  {{- if .Values.nats.credentialsFile }}
  NATS_CREDENTIALS_FILE: {{ .Values.nats.credentialsFile | quote }}
  {{- end }}
  {{- if .Values.nats.username }}
  NATS_USERNAME: {{ .Values.nats.username | quote }}
  {{- end }}
  {{- if .Values.nats.tlsCAFile }}
  NATS_TLS_CA_FILE: {{ .Values.nats.tlsCAFile | quote }}
  {{- end }}
  {{- if .Values.nats.tlsCertFile }}
  NATS_TLS_CERT_FILE: {{ .Values.nats.tlsCertFile | quote }}
  {{- end }}
  {{- if .Values.nats.tlsKeyFile }}
  NATS_TLS_KEY_FILE: {{ .Values.nats.tlsKeyFile | quote }}
  {{- end }}
  NATS_ALLOW_UNAUTHENTICATED: {{ .Values.nats.allowUnauthenticated | quote }}
