apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.sentinel5g.io"]
    resources: ["telecomsecuritypolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["security.sentinel5g.io"]
    resources: ["telecomsecuritypolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel5g-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel5g-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
