apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.sentinel5g.io"]
    resources: ["telecomsecuritypolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["security.sentinel5g.io"]
    resources: ["telecomsecuritypolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # controller-runtime's mgr.GetEventRecorder writes through the NEWER
  # events.k8s.io/v1 API, not the core one above -- so without this rule
  # every Event the operator records is rejected with "events.events.k8s.io
  # is forbidden" and only ever appears as an error in the operator's own
  # log. That silently disabled the EBPFAttachFailed Event from the moment
  # it was added; found by watching a real Event fail to land on a real
  # cluster, not by reading the manifest. The core-group rule is kept
  # because it costs nothing and covers any caller still on the legacy API.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel5g-operator.fullname" . }}
  labels:
    {{- include "sentinel5g-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel5g-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel5g-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
