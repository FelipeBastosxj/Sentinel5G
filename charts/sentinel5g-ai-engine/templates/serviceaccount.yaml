{{- if .Values.serviceAccount.create }}
# The AI engine talks to NATS and nothing else -- it never reaches the
# Kubernetes API, so this ServiceAccount intentionally has no Role or
# RoleBinding attached. It exists so the pod doesn't run as "default" (whose
# token other workloads may also hold) and so a cluster policy can target it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel5g-ai-engine.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel5g-ai-engine.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
