# Always rendered, like the operator chart's -- gives /metrics (and, in http
# mode, /v1/score) a stable in-cluster DNS name regardless of whether
# anything consumes it via ServiceMonitor, a plain scrape_config, or
# `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel5g-ai-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel5g-ai-engine.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "sentinel5g-ai-engine.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # `metrics` always exists (the ServiceMonitor scrapes it by name) and
    # points at wherever /metrics actually lives for the configured mode --
    # the dedicated prometheus_client server in nats mode, the FastAPI app
    # in http mode. See "sentinel5g-ai-engine.metricsPort" in _helpers.tpl.
    - name: metrics
      port: {{ include "sentinel5g-ai-engine.metricsPort" . }}
      targetPort: {{ if eq .Values.config.mode "http" }}http{{ else }}metrics{{ end }}
    {{- if eq .Values.config.mode "http" }}
    - name: http
      port: {{ .Values.config.httpAddr | trimPrefix ":" | int }}
      targetPort: http
    {{- end }}
