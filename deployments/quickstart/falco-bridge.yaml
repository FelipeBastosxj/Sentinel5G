# cmd/falco-bridge (Layer 1's Falco-sourced counterpart to the operator's
# own eBPF-sourced pkg/ingestion.Publisher) sitting alongside the operator
# (charts/sentinel5g-operator) and the AI engine (ai-engine.yaml) in the same
# namespace. Not part of that Helm chart, same as ai-engine.yaml -- a plain
# manifest until/unless a proper chart is worth adding.
#
# Requires Falco itself already running in the cluster (not installed by
# this manifest -- see https://falco.org/docs/getting-started/installation/,
# typically its own Helm chart) with http_output configured to POST here:
#
#   http_output:
#     enabled: true
#     url: "http://sentinel5g-falco-bridge.sentinel5g-system.svc.cluster.local:8091/falco"
#
# Deployment, not DaemonSet: unlike pkg/ingestion.Publisher (which MUST run
# on every node to attach eBPF to that node's own interface), this is a
# stateless HTTP-to-NATS translator with no per-node state of its own --
# every Falco instance's own JSON payload already carries its own node's
# hostname (Bridge.FromAlert reads it from Alert.Hostname), so it makes no
# difference which replica processes which node's alert. replicas: N behind
# the Service below load-balances Falco's cluster-wide alert volume across
# however many replicas are running, same reasoning ai-engine.yaml's NATS
# worker mode documents for its own queue-group scaling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel5g-falco-bridge
  namespace: sentinel5g-system
  labels:
    app: sentinel5g-falco-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel5g-falco-bridge
  template:
    metadata:
      labels:
        app: sentinel5g-falco-bridge
    spec:
      containers:
        - name: falco-bridge
          image: ghcr.io/felipebastosxj/sentinel5g-falco-bridge:v0.2.2
          env:
            - name: NATS_URL
              value: "nats://nats.default.svc.cluster.local:4222"
            - name: NATS_EVENTS_SUBJECT
              value: "sentinel5g.events.normalized"
            - name: FALCO_BRIDGE_LISTEN_ADDR
              value: ":8091"
            # Set FALCO_BRIDGE_SHARED_SECRET (and Falco's matching
            # http_output.headers) outside of local dev -- an
            # unauthenticated /falco endpoint lets anything that can reach
            # it forge a NormalizedEvent, same risk class as the
            # unauthenticated NATS bus documented in docs/integrations.md.
            # - name: FALCO_BRIDGE_SHARED_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: falco-bridge-shared-secret
            #       key: secret
          ports:
            - name: http
              containerPort: 8091
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel5g-falco-bridge
  namespace: sentinel5g-system
  labels:
    app: sentinel5g-falco-bridge
spec:
  selector:
    app: sentinel5g-falco-bridge
  ports:
    - name: http
      port: 8091
      targetPort: http
