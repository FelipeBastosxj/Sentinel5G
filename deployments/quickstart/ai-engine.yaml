# The AI engine (Layer 3) in-cluster, NATS worker mode, sitting alongside
# the operator in the same namespace.
#
# SUPERSEDED for anything but a throwaway demo: charts/sentinel5g-ai-engine
# is the supported way to deploy this. The chart obtains a model on its own
# (a published artifact by default), mirrors the operator chart's NATS
# auth/TLS knobs, and -- the reason it exists -- REFUSES to install without a
# model rather than coming up healthy and silently never publishing a
# ThreatScoreEvent. See docs/production-install.md step 3.
#
# This manifest is kept because it is the shortest path to a running engine
# on a cluster you already have a model Secret for, and because
# scripts/quickstart.sh's demo flow references it. It needs that Secret
# created imperatively -- the artifacts are deliberately not committed:
#
#   kubectl create secret generic ai-engine-model -n sentinel5g-system \
#     --from-file=autoencoder.onnx=cmd/ai-engine/models/autoencoder.onnx \
#     --from-file=autoencoder.onnx.data=cmd/ai-engine/models/autoencoder.onnx.data \
#     --from-file=autoencoder.norm.json=cmd/ai-engine/models/autoencoder.norm.json
#
# Produce one with `make ai-engine-train-real` first. Run that (adjust paths
# if needed) before applying this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel5g-ai-engine
  namespace: sentinel5g-system
  labels:
    app: sentinel5g-ai-engine
spec:
  # 1 for this quickstart demo, but scoring is stateless and the NATS worker
  # (sentinel_ai/server.py) now subscribes as part of a queue group
  # ("sentinel5g-ai-engine-workers"), so replicas: N safely load-balances
  # across the subject instead of every replica conflicting on the same
  # durable consumer -- bump this for real throughput.
  replicas: 1
  selector:
    matchLabels:
      app: sentinel5g-ai-engine
  template:
    metadata:
      labels:
        app: sentinel5g-ai-engine
    spec:
      containers:
        - name: ai-engine
          image: ghcr.io/felipebastosxj/sentinel5g-ai-engine:v0.2.2
          env:
            - name: AI_ENGINE_MODE
              value: "nats"
            - name: NATS_URL
              value: "nats://nats.default.svc.cluster.local:4222"
            - name: NATS_EVENTS_SUBJECT
              value: "sentinel5g.events.normalized"
            - name: NATS_THREATS_SUBJECT
              value: "sentinel5g.threats.scored"
            - name: MODEL_PATH
              value: "/app/models/autoencoder.onnx"
            # deployments/quickstart/nats.yaml has no auth configured -- opt
            # into that explicitly. Do not carry this into a production
            # deployment; see docs/integrations.md's "Securing the NATS
            # message bus" and docs/production-install.md.
            - name: NATS_ALLOW_UNAUTHENTICATED
              value: "true"
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: model
              mountPath: /app/models
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: model
          secret:
            secretName: ai-engine-model
