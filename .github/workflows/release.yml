name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless signing

jobs:
  release:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: sentinel5g-operator
            context: .
            dockerfile: Dockerfile
          - name: sentinel5g-ai-engine
            context: cmd/ai-engine
            dockerfile: cmd/ai-engine/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        # OCI/GHCR repository names must be lowercase; github.repository_owner
        # preserves the account's display case (FelipeBastosxj), which
        # buildx rejects outright ("repository name must be lowercase") --
        # only surfaced now, on this project's first-ever tag push.
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false, load: true -- build into the local Docker daemon only.
      # Previously this pushed straight to GHCR (:vX.Y.Z and :latest, both
      # public immediately) *before* the Trivy scan below ran -- a failing
      # scan couldn't un-publish an already-public, unscanned image. SBOM
      # generation and the Trivy scan below both work against this local
      # image by the same tag reference (no pull needed, Syft/Trivy resolve
      # it from the local daemon); the image is only pushed, further down,
      # once the scan has actually passed.
      - name: Build image (not pushed yet)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: false
          load: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:latest

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: ${{ matrix.component.name }}-sbom.json

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Base-OS CVEs with no upstream fix yet (e.g. a handful of
          # util-linux/ncurses/perl findings in python:3.11-slim as of
          # 2026-09) can't be acted on and would otherwise block every
          # release forever; only fail on findings that actually have a fix
          # available, so this stays a real gate instead of noise to ignore.
          ignore-unfixed: true

      # Only reached once Trivy has actually passed -- this is the step that
      # makes the image public. Pushes the same, already-scanned local image
      # (built once, above) rather than rebuilding, so the bytes that were
      # scanned are exactly the bytes that get signed and published. Reads
      # the digest back via `docker inspect` after pushing, rather than
      # trusting docker/build-push-action's own digest output with
      # push:false (whether that's populated for a load-only build isn't
      # something this project has verified) -- this queries the real,
      # just-pushed state instead of a build-time value.
      - name: Push image (only after a clean scan)
        id: push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}"
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component.name }}-sbom
          path: ${{ matrix.component.name }}-sbom.json
