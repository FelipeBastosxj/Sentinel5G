name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless signing

jobs:
  release:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: sentinel5g-operator
            context: .
            dockerfile: Dockerfile
          - name: sentinel5g-ai-engine
            context: cmd/ai-engine
            dockerfile: cmd/ai-engine/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        # OCI/GHCR repository names must be lowercase; github.repository_owner
        # preserves the account's display case (FelipeBastosxj), which
        # buildx rejects outright ("repository name must be lowercase") --
        # only surfaced now, on this project's first-ever tag push.
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:latest

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: ${{ matrix.component.name }}-sbom.json

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component.name }}-sbom
          path: ${{ matrix.component.name }}-sbom.json
