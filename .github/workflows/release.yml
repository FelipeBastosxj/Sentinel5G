name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless signing

jobs:
  # One job per (component, platform): builds a single-platform image locally
  # (buildx --load only supports one platform at a time -- a multi-arch
  # manifest can't be assembled this way, hence the separate "manifest" job
  # below), scans it, and -- only if that scan passes -- pushes the exact
  # same local image (no rebuild) to both registries under a temporary,
  # platform-specific tag. The final `docker buildx imagetools create` step
  # (in the "manifest" job) stitches each component's two per-platform
  # digests into one multi-arch manifest per registry, published under the
  # real, human-facing tags. This preserves the guarantee the previous
  # single-arch version of this workflow already established: the bytes
  # Trivy scanned are exactly the bytes that get published, never a rebuild.
  build-scan-push:
    name: Build, scan, push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: sentinel5g-operator
            context: .
            dockerfile: Dockerfile
          - name: sentinel5g-ai-engine
            context: cmd/ai-engine
            dockerfile: cmd/ai-engine/Dockerfile
          - name: sentinel5g-falco-bridge
            context: .
            dockerfile: cmd/falco-bridge/Dockerfile
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owners and a filesystem-safe platform slug
        # OCI/GHCR/Docker Hub repository names must be lowercase; github.
        # repository_owner preserves the account's display case. GHCR's
        # owner and Docker Hub's owner are computed separately -- they are
        # NOT guaranteed to be the same account/namespace (a GitHub org or
        # username has no required relationship to a Docker Hub username),
        # so this doesn't assume DOCKERHUB_USERNAME matches
        # github.repository_owner the way an earlier version of this
        # workflow incorrectly did. The slug (linux/amd64 -> linux-amd64)
        # is used both as part of the temporary per-platform tag below and
        # as an artifact name, neither of which can contain "/".
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dockerhub_owner=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "platform_slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are a manual prerequisite: create
        # a Docker Hub account/org and an Access Token (not your password),
        # then add both as repository secrets under these exact names --
        # see CONTRIBUTING.md. Nothing in this workflow can do that part for
        # you.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false, load: true -- build into the local Docker daemon only,
      # single platform (matrix.platform), so it lands in the daemon at all
      # (multi-platform --load isn't supported). SBOM generation and the
      # Trivy scan below both work against this local image by the same tag
      # reference; it's only pushed, further down, once the scan has
      # actually passed -- see this job's own top comment.
      - name: Build image (not pushed yet)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: local/${{ matrix.component.name }}:${{ steps.vars.outputs.platform_slug }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ matrix.component.name }}:${{ steps.vars.outputs.platform_slug }}
          format: cyclonedx-json
          output-file: ${{ matrix.component.name }}-${{ steps.vars.outputs.platform_slug }}-sbom.json

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.component.name }}:${{ steps.vars.outputs.platform_slug }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Base-OS CVEs with no upstream fix yet can't be acted on and would
          # otherwise block every release forever; only fail on findings
          # that actually have a fix available, so this stays a real gate
          # instead of noise to ignore.
          ignore-unfixed: true

      # Only reached once Trivy has actually passed. Tags and pushes the
      # SAME local image built above (`docker push` of an already-daemon-
      # local image reuses its existing layers -- this is not a rebuild) to
      # both registries under a temporary, platform-specific tag; the
      # "manifest" job below references these by digest, then this tag is
      # never seen by anyone pulling the real, human-facing tag.
      - name: Push per-platform image to both registries (only after a clean scan)
        id: push
        run: |
          set -euo pipefail
          LOCAL="local/${{ matrix.component.name }}:${{ steps.vars.outputs.platform_slug }}"
          GHCR="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component.name }}:${{ github.ref_name }}-${{ steps.vars.outputs.platform_slug }}"
          DOCKERHUB="docker.io/${{ steps.vars.outputs.dockerhub_owner }}/${{ matrix.component.name }}:${{ github.ref_name }}-${{ steps.vars.outputs.platform_slug }}"

          # Digest is parsed from `docker push`'s own final "<tag>: digest:
          # sha256:... size: ..." line, NOT read back via `docker inspect
          # --format='{{index .RepoDigests 0}}'` -- verified the hard way
          # against a real (local, throwaway) registry that this local image
          # is tagged for *two* registries at once, so its RepoDigests list
          # has one entry per registry, and index 0 is whichever happened to
          # be pushed/pulled first, not necessarily the one just pushed here
          # -- confirmed picking up a stale, wrong digest from an unrelated
          # earlier pull. Parsing push's own reported digest has no such
          # ambiguity: it's always the digest of what that exact command
          # just pushed.
          push_digest() {
            local out
            out="$(docker push "$1" 2>&1)"
            echo "$out" >&2
            grep -oE 'digest: sha256:[0-9a-f]{64}' <<<"$out" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1
          }

          docker tag "$LOCAL" "$GHCR"
          ghcr_digest=$(push_digest "$GHCR")
          docker tag "$LOCAL" "$DOCKERHUB"
          dockerhub_digest=$(push_digest "$DOCKERHUB")

          [ -n "$ghcr_digest" ] || { echo "failed to parse a digest from the GHCR push output" >&2; exit 1; }
          [ -n "$dockerhub_digest" ] || { echo "failed to parse a digest from the Docker Hub push output" >&2; exit 1; }

          echo "ghcr_digest=$ghcr_digest" >> "$GITHUB_OUTPUT"
          echo "dockerhub_digest=$dockerhub_digest" >> "$GITHUB_OUTPUT"

      - name: Record digests for the manifest job
        # Matrix job outputs don't aggregate across combinations -- the
        # "manifest" job below reads these back via download-artifact
        # instead of `needs.*.outputs`. Filename includes platform_slug
        # because the manifest job downloads every platform's artifact for a
        # component into one shared directory (merge-multiple: true) -- two
        # artifacts both containing a file named "digest.json" would
        # silently overwrite each other there.
        run: |
          mkdir -p /tmp/digests
          cat > "/tmp/digests/digest-${{ steps.vars.outputs.platform_slug }}.json" <<EOF
          {
            "component": "${{ matrix.component.name }}",
            "platform": "${{ matrix.platform }}",
            "ghcr_digest": "${{ steps.push.outputs.ghcr_digest }}",
            "dockerhub_digest": "${{ steps.push.outputs.dockerhub_digest }}"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component.name }}-${{ steps.vars.outputs.platform_slug }}
          path: /tmp/digests/digest-${{ steps.vars.outputs.platform_slug }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component.name }}-${{ steps.vars.outputs.platform_slug }}-sbom
          path: ${{ matrix.component.name }}-${{ steps.vars.outputs.platform_slug }}-sbom.json

  # Stitches each component's linux/amd64 + linux/arm64 digests (already
  # published under temporary tags by build-scan-push above) into one
  # multi-arch manifest per registry, under the real vX.Y.Z/latest tags, then
  # signs each manifest. No rebuild and no re-scan here -- imagetools create
  # only assembles a manifest list referencing already-published digests.
  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-scan-push
    strategy:
      matrix:
        component: [sentinel5g-operator, sentinel5g-ai-engine, sentinel5g-falco-bridge]
    steps:
      - name: Compute lowercase image owners
        # See build-scan-push's identically named step: GHCR's owner and
        # Docker Hub's owner are computed separately, not assumed equal.
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dockerhub_owner=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Assemble digests from both platform jobs
        id: digests
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          ghcr, dockerhub = [], []
          for f in pathlib.Path("/tmp/digests").glob("*.json"):
              d = json.loads(f.read_text())
              ghcr.append(d["ghcr_digest"])
              dockerhub.append(d["dockerhub_digest"])

          if len(ghcr) != 2 or len(dockerhub) != 2:
              raise SystemExit(f"expected 2 platform digests per registry, got ghcr={ghcr} dockerhub={dockerhub}")

          print(f"ghcr_digests={' '.join(ghcr)}")
          print(f"dockerhub_digests={' '.join(dockerhub)}")
          EOF

      - name: Create and push multi-arch manifests
        id: manifests
        run: |
          set -euo pipefail
          GHCR_REPO="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component }}"
          DOCKERHUB_REPO="docker.io/${{ steps.vars.outputs.dockerhub_owner }}/${{ matrix.component }}"

          docker buildx imagetools create \
            -t "$GHCR_REPO:${{ github.ref_name }}" -t "$GHCR_REPO:latest" \
            $(for d in ${{ steps.digests.outputs.ghcr_digests }}; do echo "$GHCR_REPO@$d"; done)

          docker buildx imagetools create \
            -t "$DOCKERHUB_REPO:${{ github.ref_name }}" -t "$DOCKERHUB_REPO:latest" \
            $(for d in ${{ steps.digests.outputs.dockerhub_digests }}; do echo "$DOCKERHUB_REPO@$d"; done)

          ghcr_manifest_digest=$(docker buildx imagetools inspect "$GHCR_REPO:${{ github.ref_name }}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          dockerhub_manifest_digest=$(docker buildx imagetools inspect "$DOCKERHUB_REPO:${{ github.ref_name }}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "ghcr_manifest_digest=$ghcr_manifest_digest" >> "$GITHUB_OUTPUT"
          echo "dockerhub_manifest_digest=$dockerhub_manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign both multi-arch manifests (keyless)
        # Signs the manifest list itself, which covers the platform-specific
        # sub-images it references -- no need to sign each platform digest
        # separately.
        run: |
          cosign sign --yes "ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.component }}@${{ steps.manifests.outputs.ghcr_manifest_digest }}"
          cosign sign --yes "docker.io/${{ steps.vars.outputs.dockerhub_owner }}/${{ matrix.component }}@${{ steps.manifests.outputs.dockerhub_manifest_digest }}"

  # Publishes both Helm charts as OCI artifacts to GHCR --
  # `helm install oci://ghcr.io/.../charts/sentinel5g-operator --version
  # X.Y.Z` becomes possible without cloning the repo first, the same gap
  # README.md's "No hosted chart repository is published yet" flags. GHCR
  # already hosts OCI artifacts generally (it's how the multi-arch image
  # manifests above are stored too), so this reuses that registry and the
  # same cosign signing step rather than standing up a separate index.yaml-
  # based chart repository. Independent of build-scan-push/manifest above
  # (no `needs`): a chart-only release doesn't have to wait on image builds.
  publish-chart:
    name: Publish Helm charts (OCI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [sentinel5g-operator, sentinel5g-ai-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Chart.yaml's version matches this release tag
        # Chart.yaml's version is the source of truth (bumped by hand as
        # part of the release PR, alongside CHANGELOG.md, the same way
        # appVersion already tracks the image tag) -- this only catches
        # forgetting to bump it before tagging, it doesn't derive it.
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version="$(grep -m1 '^version:' charts/${{ matrix.chart }}/Chart.yaml | awk '{print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME (version $tag_version) does not match" >&2
            echo "charts/${{ matrix.chart }}/Chart.yaml's version: $chart_version" >&2
            echo "Bump Chart.yaml's version (and appVersion) to match before tagging a release." >&2
            exit 1
          fi

      - name: Compute lowercase image owner
        # See build-scan-push's identically named step for why this can't
        # just be github.repository_owner as-is.
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push the chart as an OCI artifact
        id: push
        run: |
          set -euo pipefail
          helm package charts/${{ matrix.chart }} --destination /tmp
          push_out="$(helm push /tmp/${{ matrix.chart }}-*.tgz "oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts" 2>&1)"
          echo "$push_out" >&2
          digest="$(grep -oE 'Digest: sha256:[0-9a-f]{64}' <<<"$push_out" | grep -oE 'sha256:[0-9a-f]{64}')"
          [ -n "$digest" ] || { echo "failed to parse a digest from helm push output" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the chart (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ steps.vars.outputs.owner }}/charts/${{ matrix.chart }}@${{ steps.push.outputs.digest }}"

  # Trains a model from the committed real dataset and publishes it as its
  # own image, so `helm install` of charts/sentinel5g-ai-engine produces a
  # deployment that actually scores.
  #
  # This closes ROADMAP.md Phase 2.5's remaining "no way to obtain a model"
  # item. The artifacts (autoencoder.onnx + .onnx.data + .norm.json) are
  # deliberately not committed, so before this the only way to get them was
  # to train locally and hand-create a Secret -- and skipping that produced a
  # deployment that came up healthy and silently never published a
  # ThreatScoreEvent.
  #
  # Reproducible from the repository alone: docs/paper-data/real-dataset/ is
  # committed, scripts/build_real_dataset.py is deterministic, and train.py
  # is seeded. Independent of the image jobs (no `needs`) for the same reason
  # publish-chart is.
  publish-model:
    name: Publish the trained model artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the AI engine with its training extras
        # torch is training-time only and deliberately not in the serving
        # image's dependencies (see cmd/ai-engine/pyproject.toml).
        run: pip install -e "./cmd/ai-engine[train]"

      - name: Train and export from the committed real dataset
        run: make ai-engine-train-real

      - name: Record what was trained
        # The reference_error and the dataset hash go into the run summary so
        # a published model is traceable back to the exact data that produced
        # it -- otherwise "which model is this" has no answer after the fact.
        run: |
          set -euo pipefail
          {
            echo "### Model artifact"
            echo
            echo '```json'
            cat cmd/ai-engine/models/autoencoder.norm.json
            echo '```'
            echo
            echo "Dataset sha256: $(sha256sum cmd/ai-engine/data/real_dataset.npz | cut -d' ' -f1)"
            echo "Captures sha256: $(cat docs/paper-data/real-dataset/*.pcap | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push the model image
        id: push
        # Multi-arch like every other published image. The model artifact
        # itself is architecture-independent, but the busybox base the chart's
        # initContainer runs `cp` from is not, so an amd64-only manifest would
        # fail to schedule on the arm64 nodes the other images already support.
        uses: docker/build-push-action@v6
        with:
          context: cmd/ai-engine
          file: cmd/ai-engine/Dockerfile.model
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/sentinel5g-model:${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the model artifact (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ steps.vars.outputs.owner }}/sentinel5g-model@${{ steps.push.outputs.digest }}"
