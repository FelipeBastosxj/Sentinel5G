name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      bpf: ${{ steps.filter.outputs.bpf }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Every filter also matches this workflow file itself, so editing
          # ci.yml always runs the full suite instead of silently skipping
          # whatever job the edit actually affects.
          filters: |
            go:
              - 'api/**'
              - 'cmd/operator/**'
              - 'cmd/falco-bridge/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'config/crd/bases/**'
              - '.github/workflows/ci.yml'
            python:
              - 'cmd/ai-engine/**'
              - '.github/workflows/ci.yml'
            bpf:
              - 'bpf/**'
              - '.github/workflows/ci.yml'
            helm:
              - 'charts/**'
              - 'config/crd/bases/**'
              - '.github/workflows/ci.yml'

  go:
    name: Go build/lint/test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy (verify go.sum is up to date)
        run: |
          go mod tidy
          git diff --exit-code go.sum
      - name: manifests (verify generated CRD/deepcopy are up to date)
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5
          controller-gen object paths="./api/v1alpha1/..."
          controller-gen crd paths="./api/v1alpha1/..." output:crd:artifacts:config=config/crd/bases
          git diff --exit-code api/v1alpha1/zz_generated.deepcopy.go config/crd/bases
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # Includes gosec (see .golangci.yml) for security-specific static
        # analysis, in addition to the correctness/style linters. Pinned
        # (not "latest"): golangci-lint v1 is no longer patched upstream, so
        # "latest" landing on v2 broke CI outright (v2's binary is built
        # against a specific Go version, and its config schema is a breaking
        # change from v1 — .golangci.yml is already migrated to it).
        # golangci-lint-action@v6 itself only understands v1 golangci-lint
        # binaries and refuses to run a v2 version string at all — v7+ is
        # required for v2 support; pinned to v9.3.0, the latest action
        # release as of this fix. Bump both deliberately, in step with
        # go.mod's toolchain line, not as a side effect of "latest" drifting.
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
      - name: govulncheck (known-vulnerable dependency scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Start NATS JetStream
        # GitHub Actions' `services:` block can't pass a custom command
        # (needed here for `-js`), so start it as a plain container instead.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
          for i in $(seq 1 20); do
            nc -z localhost 4222 && break
            sleep 0.5
          done
      - name: Set up envtest (real kube-apiserver + etcd)
        # Backs pkg/controller/envtest_test.go — a real API server, not a
        # fake client, so it also catches the hand-maintained CRD YAML
        # drifting from api/v1alpha1's Go types (see that file's docstring).
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.36.2 -p path)" >> "$GITHUB_ENV"
      - name: go test
        run: go test ./pkg/... ./api/... -v -cover

  python:
    name: AI engine lint/test
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cmd/ai-engine/pyproject.toml
      - name: Install dependencies
        # [train] (torch/onnx/onnxscript) is needed for tests/test_inference.py
        # and the train/export scripts, but deliberately excluded from the
        # serving image's own install (Dockerfile just runs `pip install .`)
        # -- see pyproject.toml's dependencies/train split.
        run: pip install -e ".[dev,train]"
      - name: black --check
        run: black --check .
      - name: flake8
        run: flake8 .
      - name: bandit (security lint)
        run: bandit -q -r sentinel_ai scripts
      - name: pip-audit (known-vulnerable dependency scan)
        run: pip-audit
      - name: pytest
        run: pytest

  bpf:
    name: eBPF compile check
    needs: changes
    if: needs.changes.outputs.bpf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang/llvm
        # No more bpftool or host BTF: bpf/packet_filter.c now builds
        # against headers/vmlinux_min.h, a small hand-maintained stand-in
        # for a `bpftool btf dump`-generated vmlinux.h (see that file's own
        # top comment for why the host's /sys/kernel/btf/vmlinux is no
        # longer needed at all) -- this runner, a dev machine, and
        # `docker build` (see Dockerfile's bpf-builder stage) all now build
        # the exact same way. libbpf-dev still provides <bpf/bpf_helpers.h>
        # and <bpf/bpf_endian.h>.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
      - name: Compile bpf/packet_filter.c
        run: make -C bpf

  helm-lint:
    name: Helm chart lint
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: helm lint charts/sentinel5g-operator
      - name: CRD drift check (config/crd/bases vs. the Helm chart's copy)
        # charts/sentinel5g-operator/templates/crd.yaml is a hand-copied
        # duplicate of config/crd/bases/...yaml (controller-gen's own
        # output, already diff-checked against the Go types in the "go"
        # job's "manifests" step) -- nothing tied the two copies together
        # until now, so a schema change could update one and silently ship
        # a stale CRD via `helm install`. YAML-aware compare, not a raw
        # text/regex diff: the chart file has Helm's own `{{- if }}`/
        # `{{- end }}` wrapper lines a plain CRD file doesn't.
        run: |
          pip install --quiet pyyaml
          helm template x charts/sentinel5g-operator --show-only templates/crd.yaml --set crds.install=true > /tmp/chart-crd.yaml
          python3 - <<'EOF'
          import sys
          import yaml

          with open("config/crd/bases/security.sentinel5g.io_telecomsecuritypolicies.yaml") as f:
              base = yaml.safe_load(f)
          with open("/tmp/chart-crd.yaml") as f:
              chart = yaml.safe_load(f)

          if base != chart:
              print(
                  "charts/sentinel5g-operator/templates/crd.yaml has drifted from "
                  "config/crd/bases/security.sentinel5g.io_telecomsecuritypolicies.yaml "
                  "-- update the chart's hand-copied CRD to match controller-gen's "
                  "output (run `make manifests` first if config/crd/bases/ itself is "
                  "stale). See CONTRIBUTING.md."
              )
              sys.exit(1)
          print("CRD copies match.")
          EOF
