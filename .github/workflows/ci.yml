name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Ingestion Service
  # ---------------------------------------------------------------------------
  ingestion-service:
    name: Ingestion Service — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ingestion-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Processing Service
  # ---------------------------------------------------------------------------
  processing-service:
    name: Processing Service — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/processing-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/processing-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Realtime Gateway
  # ---------------------------------------------------------------------------
  realtime-gateway:
    name: Realtime Gateway — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/realtime-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Webhook Service
  # ---------------------------------------------------------------------------
  webhook-service:
    name: Webhook Service — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webhook-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/webhook-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Angular Dashboard
  # ---------------------------------------------------------------------------
  angular-dashboard:
    name: Angular Dashboard — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/angular-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

  # ---------------------------------------------------------------------------
  # CI Gate — all jobs must pass
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - ingestion-service
      - processing-service
      - realtime-gateway
      - webhook-service
      - angular-dashboard
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
