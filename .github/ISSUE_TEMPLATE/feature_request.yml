name: Feature request
description: Propose a new capability for Sentinel5G
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Sentinel5G doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: layer
    attributes:
      label: Which layer does this affect?
      multiple: true
      options:
        - Layer 1 — Capture & kernel (bpf/)
        - Layer 2 — Ingestion & pipeline (pkg/events)
        - Layer 3 — AI engine (cmd/ai-engine)
        - Layer 4 — Controller & automation (pkg/controller, pkg/ebpf, pkg/mesh)
        - Packaging (charts/, config/)
        - Other / cross-cutting
