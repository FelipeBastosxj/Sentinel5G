name: Bug report
description: Report a defect in Sentinel5G
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - bpf (eBPF capture)
        - cmd/operator (Go operator)
        - cmd/ai-engine (Python AI engine)
        - charts / config (Helm/Kustomize)
        - CI/CD
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Apply this TelecomSecurityPolicy...
        2. Publish this ThreatScoreEvent...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes version, kernel version (for bpf/ issues), Sentinel5G version/commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
